name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # HTTP/3 needs MsQuic, which does not ship with .NET. Without it the QUIC half of the HTTP/3
      # suite skips itself, so installing it here is what makes that coverage real on at least one
      # platform. The Windows runners carry Schannel's QUIC support already.
      - name: Install libmsquic
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          curl -fsSL "https://packages.microsoft.com/config/${ID}/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/ms-prod.deb
          sudo dpkg -i /tmp/ms-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Build
        run: dotnet build AutoHttps.slnx -c Release

      # The suites are run one project at a time. Each test starts a Kestrel server and an ACME
      # server of its own, and running every assembly at once starves the TLS handshakes the
      # assertions depend on.
      - name: Unit tests
        run: dotnet test test/AutoHttps.Tests/AutoHttps.Tests.csproj -c Release --no-build

      - name: Integration tests
        run: dotnet test test/AutoHttps.IntegrationTests/AutoHttps.IntegrationTests.csproj -c Release --no-build

      # The DNS-provider suites mock their SDK or HTTP calls, so they need no services and run on both
      # operating systems. The Redis suite needs a live server and runs in its own job below.
      - name: Cloudflare tests
        run: dotnet test test/AutoHttps.Cloudflare.Tests/AutoHttps.Cloudflare.Tests.csproj -c Release --no-build

      - name: Route 53 tests
        run: dotnet test test/AutoHttps.Route53.Tests/AutoHttps.Route53.Tests.csproj -c Release --no-build

      - name: Azure tests
        run: dotnet test test/AutoHttps.Azure.Tests/AutoHttps.Azure.Tests.csproj -c Release --no-build

  redis:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The fixture fails loudly rather than skipping when Redis is absent, so a job that could not
      # reach the service turns red instead of reporting a hollow green.
      - name: Redis tests
        run: dotnet test test/AutoHttps.Redis.Tests/AutoHttps.Redis.Tests.csproj -c Release

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack src/AutoHttps/AutoHttps.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
