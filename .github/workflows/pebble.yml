# Runs the suite against Pebble, the ACME test server Let's Encrypt builds alongside Boulder, so
# the client is checked against an implementation nobody here wrote. It runs on every pull request,
# so a change that Let's Encrypt's own code refuses is caught before it merges, nightly so a new
# Pebble release that changes behaviour is noticed, and by hand.
name: Pebble

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

jobs:
  pebble:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Start Pebble
        run: docker compose -f test/pebble/docker-compose.yml up -d

      - name: Pebble tests
        env:
          AUTOHTTPS_HOST_ADDRESS: 172.17.0.1
        run: dotnet test test/AutoHttps.PebbleTests/AutoHttps.PebbleTests.csproj -c Release

      - name: Stop Pebble
        if: always()
        run: docker compose -f test/pebble/docker-compose.yml down
